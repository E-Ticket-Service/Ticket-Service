databaseChangeLog:
  - changeSet:
      id: 20260412-1-create-tbl-bucket
      author: nurlanaliyev
      changes:
        - createTable:
            tableName: buckets
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime
              - column:
                  name: updated_at
                  type: datetime
              - column:
                  name: status
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: int

              - addForeignKeyConstraint:
                  baseTableName: bucket_items
                  baseColumnNames: bucket_id
                  referencedTableName: buckets
                  referencedColumnNames: id
                  constraintName: fk_bucket_items_bucket
                  onDelete: CASCADE


