databaseChangeLog:
  - changeSet:
      id: 20260412-1-create-tbl-orderItem
      author: nurlanaliyev
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: price
                  type: decimal
              - column:
                  name: created_at
                  type: datetime
              - column:
                  name: updated_at
                  type: datetime
              - column:
                  name: status
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: int

              - addForeignKeyConstraint:
                  baseTableName: order_items
                  baseColumnNames: event_session_id
                  referencedTableName: event_sessions
                  referencedColumnNames: id
                  constraintName: fk_order_items_event_session
                  onDelete: RESTRICT

              - addForeignKeyConstraint:
                  baseTableName: order_items
                  baseColumnNames: seat_id
                  referencedTableName: seats
                  referencedColumnNames: id
                  constraintName: fk_order_items_seat
                  onDelete: RESTRICT