spring:
  application:
    name: ticket-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:app-db}?currentSchema=${DB_SCHEMA:ticket_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:ticket_db}
    hibernate:
      ddl-auto: update

  web:
    error:
      include-message: always
      include-binding-errors: always

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
    consumer:
      group-id: ticket-service-group
      auto-offset-reset: earliest

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      reservation-key: "reservation:session:%d:seat:%d"
      payment-idempotency-key: "payment:processed:%d"
      reservation-ttl-minutes: 10
      payment-idempotency-ttl-hours: 24

server:
  port: 8082
